.mile-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:11px;margin-bottom:7px;cursor:pointer}

const RELAPSE_COACHING = {

  ],

    "Un desliz no es un fracaso. Una comida mala no arruina una semana de buenas decisiones. Vuelve al siguiente plato.",

  ],

// ── UTILS ───────────────────────────────────────────────────────────────────

const todayKey = () => new Date().toISOString().split("T")[0];
const dayOfYear = () => {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
};
const getDaysSince = d => {
  if (!d) return 0;
  return Math.max(0, Math.floor((new Date() - new Date(d)) / 86400000));
};
const getLS = (k, fb) => { try { const v = localStorage.getItem(k); return v !== null ? v : fb; } catch { return fb; } };
const setLS = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("es-ES", {day:"numeric", month:"long", year:"numeric"}) : "—";

// ── COMPONENTS ──────────────────────────────────────────────────────────────

function CounterCard({counter, days, onRelapse, onSetDate}) {
  const {key, label, icon, color, milestones, unit} = counter;
  const reached = milestones.filter(m => m.day <= days);
  const current = reached[reached.length - 1];
  const next = milestones.find(m => m.day > days);
  const pct = next ? Math.min(100, (days / next.day) * 100) : 100;
  const isExercise = key === "exercise";

  return (
    <div style={{background:`${color}0d`, border:`1px solid ${color}28`, borderRadius:16, padding:"16px 16px 13px", position:"relative"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:10, color:color, textTransform:"uppercase", letterSpacing:1.8, marginBottom:5, opacity:.8}}>{icon} {label}</div>
          <div style={{display:"flex", alignItems:"baseline", gap:5}}>
            <span className="hd" style={{fontSize:48, fontWeight:700, color, lineHeight:1}}>{days}</span>
            <span style={{fontSize:14, color:`${color}66`}}>{unit}</span>
          </div>
          {!isExercise && <div style={{fontSize:11, color:`${color}77`, marginTop:3}}>desde {fmtDate(getLS(counter.sk,""))}</div>}
        </div>
        <div style={{flex:1, textAlign:"right", paddingTop:2, paddingLeft:10}}>
          {current && <div style={{fontSize:12, color:`${color}cc`, lineHeight:1.4, marginBottom:6}}>✓ {current.short}</div>}
          {next && <>
            <div style={{fontSize:10, color:"rgba(255,255,255,0.2)", marginBottom:3}}>
              {isExercise ? `sesión ${next.day}:` : `día ${next.day}:`} {next.short}
            </div>
            <div className="pb-o"><div className="pb-i" style={{width:`${pct}%`, background:color}}/></div>
          </>}
        </div>
      </div>
      <div style={{display:"flex", gap:8, marginTop:12, flexWrap:"wrap"}}>
        <button onClick={onSetDate} style={{background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.12)", color:"#8aaa8a", borderRadius:8, padding:"6px 12px", cursor:"pointer", fontSize:11, fontFamily:"'Source Sans 3',sans-serif"}}>
          {isExercise ? "➕ Sumar sesión" : "✏️ Cambiar fecha"}
        </button>
        {!isExercise && onRelapse && (
          <button className="relapse-btn" onClick={onRelapse}>⚠️ Tuve una recaída</button>
        )}
      </div>
    </div>
  );
}

function MilestoneList({milestones, days, isExercise}) {
  const [selected, setSelected] = useState(null);
  return (
    <div>
      {milestones.map(m => {
        const reached = m.day <= days;
        const isCur = milestones.filter(x => x.day <= days).slice(-1)[0]?.day === m.day;
        return (
          <div key={m.day} className="mile-row" onClick={() => setSelected(selected?.day === m.day ? null : m)}
            style={{borderLeft:`3px solid ${reached?(isCur?"#f0d050":"#5cba8a"):"rgba(255,255,255,0.08)"}`, background:isCur?"rgba(240,208,50,0.06)":reached?"rgba(92,186,138,0.03)":"transparent", opacity:reached?1:.38}}>
            <div style={{fontSize:22, flexShrink:0}}>{m.icon}</div>
            <div style={{flex:1}}>
              <div style={{display:"flex", alignItems:"center", gap:7, flexWrap:"wrap"}}>
                <span style={{fontSize:13, fontWeight:700, color:reached?"#b8d8c0":"#3a5a3a"}}>
                  {isExercise ? `Sesión ${m.day}` : (m.day < 7 ? `Día ${m.day}` : m.day < 30 ? `Semana ${Math.round(m.day/7)}` : m.day < 365 ? `Mes ${Math.round(m.day/30)}` : "1 Año")}
                </span>
                {isCur && <span style={{fontSize:9, background:"#f0d050", color:"#201400", borderRadius:5, padding:"2px 7px", fontWeight:700}}>ESTÁS AQUÍ</span>}
                {reached && !isCur && <span style={{fontSize:9, background:"#5cba8a", color:"#081408", borderRadius:5, padding:"2px 7px", fontWeight:700}}>✓</span>}
              </div>
              <div style={{fontSize:12, color:reached?"#6a8a6a":"#2a4a2a", marginTop:2}}>{m.short}</div>
              {selected?.day === m.day && <div style={{fontSize:12, color:"#90b090", lineHeight:1.6, marginTop:8, paddingTop:8, borderTop:"1px solid rgba(255,255,255,0.07)"}}>{m.body}</div>}
            </div>
            <div style={{fontSize:12, color:"#2a4a2a"}}>{selected?.day === m.day ? "▲" : "›"}</div>
          </div>
        );
      })}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────

function App() {
  // Dates & sessions
  const [smokingStart, setSmokingStart] = useState(() => getLS("smokingStart",""));
  const [dietStart, setDietStart]       = useState(() => getLS("dietStart",""));
  const [exSessions, setExSessions]     = useState(() => parseInt(getLS("exSessions","0")));
  const [pillsDone, setPillsDone]       = useState(() => getLS("pills_"+todayKey(),"") === "1");

  // Relapses
  const [smokingRelapses, setSmokingRelapses] = useState(() => { try { return JSON.parse(getLS("smokingRelapses","[]")); } catch { return []; } });
  const [dietRelapses, setDietRelapses]       = useState(() => { try { return JSON.parse(getLS("dietRelapses","[]")); } catch { return []; } });

  // UI state
  const [activeTab, setActiveTab] = useState("hoy");
  const [activeSciCounter, setActiveSciCounter] = useState("smoking");
  const [modal, setModal] = useState(null); // {type, counter?}
  const [dateInput, setDateInput] = useState("");
  const [relapseCoach, setRelapseCoach] = useState(null);
  const [now, setNow] = useState(new Date());

  // Auto-refresh every minute so counters update at midnight
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(id);
  }, []);

  const smokingDays = smokingStart ? getDaysSince(smokingStart) : 0;
  const dietDays    = dietStart    ? getDaysSince(dietStart)    : 0;

  // Daily rotating content
  const doi = dayOfYear();
  const quote = DAILY_QUOTES[doi % DAILY_QUOTES.length];
  const tips = {
    smoking:  DAILY_TIPS.smoking[doi % DAILY_TIPS.smoking.length],
    diet:     DAILY_TIPS.diet[doi % DAILY_TIPS.diet.length],
    exercise: DAILY_TIPS.exercise[doi % DAILY_TIPS.exercise.length],
  };

  function handleRelapse(key) {
    const msg = RELAPSE_COACHING[key][Math.floor(Math.random() * RELAPSE_COACHING[key].length)];
    setRelapseCoach({key, msg});
  }

  function confirmRelapse(key) {
    const today = todayKey();
    if (key === "smoking") {
      const r = [...smokingRelapses, today];
      setSmokingRelapses(r); setLS("smokingRelapses", JSON.stringify(r));
      setSmokingStart(today); setLS("smokingStart", today);
    } else {
      const r = [...dietRelapses, today];
      setDietRelapses(r); setLS("dietRelapses", JSON.stringify(r));
      setDietStart(today); setLS("dietStart", today);
    }
    setRelapseCoach(null);
  }

  function openSetDate(key) {
    if (key === "exercise") {
      setModal({type:"addSession"});
    } else {
      setDateInput(key === "smoking" ? smokingStart : dietStart);
      setModal({type:"setDate", key});
    }
  }

  function saveDate() {
    if (!dateInput) return;
    if (modal.key === "smoking") { setSmokingStart(dateInput); setLS("smokingStart", dateInput); }
    else                         { setDietStart(dateInput);    setLS("dietStart",    dateInput); }
    setModal(null);
  }

  function addSession() {
    const n = exSessions + 1;
    setExSessions(n); setLS("exSessions", String(n));
    setModal(null);
  }

  function togglePills() {
    const next = !pillsDone;
    setPillsDone(next); setLS("pills_"+todayKey(), next ? "1" : "0");
  }

  const today = now.toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
  const sciCounter = COUNTERS.find(c => c.key === activeSciCounter);
  const sciDays = activeSciCounter === "smoking" ? smokingDays : activeSciCounter === "diet" ? dietDays : exSessions;

  return (
    <div style={{background:"linear-gradient(160deg,#0c1c0c,#152015,#0c160c)", minHeight:"100vh", paddingBottom:50}}>

      {/* ── HEADER ── */}
      <div style={{background:"linear-gradient(180deg,rgba(92,186,138,0.12) 0%,transparent 100%)", padding:"22px 16px 16px", borderBottom:"1px solid rgba(255,255,255,0.05)", textAlign:"center"}}>
        <div className="hd" style={{fontSize:24, color:"#b0d8c0", marginBottom:2}}>Tu Reto de Salud</div>
        <div style={{fontSize:10, color:"#4a7a4a", letterSpacing:3, textTransform:"uppercase", marginBottom:14}}>Cuerpo · Mente · Constancia</div>

        {/* COUNTERS */}
        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          <CounterCard counter={COUNTERS[0]} days={smokingDays} onRelapse={()=>handleRelapse("smoking")} onSetDate={()=>openSetDate("smoking")}/>
          <CounterCard counter={COUNTERS[1]} days={dietDays}    onRelapse={()=>handleRelapse("diet")}    onSetDate={()=>openSetDate("diet")}/>
          <CounterCard counter={COUNTERS[2]} days={exSessions}  onRelapse={null}                         onSetDate={()=>openSetDate("exercise")}/>
        </div>

        {/* Daily quote */}
        <div style={{marginTop:14, background:"rgba(240,200,70,0.06)", border:"1px solid rgba(240,200,70,0.15)", borderRadius:12, padding:"12px 15px", textAlign:"left"}}>
          <div style={{fontSize:10, color:"#907040", textTransform:"uppercase", letterSpacing:1.5, marginBottom:5}}>💬 Frase del día</div>
          <div className="hd" style={{fontSize:14, color:"#d8c878", lineHeight:1.6, fontStyle:"italic"}}>"{quote}"</div>
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{display:"flex", gap:3, padding:"12px 12px 0", overflowX:"auto"}}>
        {[{id:"hoy",l:"📋 Hoy"},{id:"ciencia",l:"🔬 Ciencia"},{id:"consejos",l:"💡 Consejos"}].map(t=>(
          <button key={t.id} className={`tab ${activeTab===t.id?"on":""}`} onClick={()=>setActiveTab(t.id)}>{t.l}</button>
        ))}
      </div>

      <div style={{padding:13}}>

        {/* ── TAB HOY ── */}
        {activeTab === "hoy" && (
          <div>
            <div style={{fontSize:11, color:"#4a7a4a", textTransform:"uppercase", letterSpacing:2, marginBottom:14, textAlign:"center"}}>{today}</div>

            {/* Pills */}
            <button onClick={togglePills} style={{width:"100%", border:"none", borderRadius:14, padding:"15px 17px", textAlign:"left", display:"flex", alignItems:"center", gap:12, cursor:"pointer", marginBottom:10, background:pillsDone?"rgba(154,122,208,0.15)":"rgba(255,255,255,0.04)", borderWidth:1, borderStyle:"solid", borderColor:pillsDone?"rgba(154,122,208,0.4)":"rgba(255,255,255,0.08)"}}>
              <div style={{width:42, height:42, borderRadius:"50%", background:pillsDone?"#9a7ad0":"rgba(255,255,255,0.08)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, color:pillsDone?"#fff":undefined, transition:"all .3s", flexShrink:0}}>
                {pillsDone ? "✓" : "💊"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:14, fontWeight:600, color:pillsDone?"#deeede":"#7a9a7a"}}>Pastillas tomadas</div>
                <div style={{fontSize:11, color:"#3a5a3a", marginTop:2}}>Hábito diario imprescindible</div>
              </div>
              <div style={{fontSize:12, color:pillsDone?"#9a7ad0":"#254525", fontWeight:600}}>{pillsDone?"¡Listo!":"Tap"}</div>
            </button>

            {/* Status cards */}
            {[
              {key:"smoking", label:"Sin fumar", icon:"🚭", color:"#f0c84a", days:smokingDays, start:smokingStart, relapses:smokingRelapses.length},
              {key:"diet",    label:"Dieta limpia", icon:"🥗", color:"#e07060", days:dietDays, start:dietStart, relapses:dietRelapses.length},
              {key:"exercise",label:"Ejercicio", icon:"🏋️", color:"#60c4e0", days:exSessions, start:null, relapses:null},
            ].map(c => (
              <div key={c.key} style={{background:`${c.color}0a`, border:`1px solid ${c.color}22`, borderRadius:13, padding:"13px 15px", marginBottom:10}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                  <div style={{display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:22}}>{c.icon}</span>
                    <div>
                      <div style={{fontSize:13, fontWeight:600, color:c.color}}>{c.label}</div>
                      <div style={{fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:1}}>
                        {c.start ? `Desde ${fmtDate(c.start)}` : `${c.days} sesiones acumuladas`}
                      </div>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="hd" style={{fontSize:28, fontWeight:700, color:c.color, lineHeight:1}}>{c.days}</div>
                    <div style={{fontSize:10, color:`${c.color}77`}}>{c.key==="exercise"?"sesiones":"días"}</div>
                  </div>
                </div>
                {c.relapses !== null && c.relapses > 0 && (
                  <div style={{fontSize:11, color:"rgba(255,255,255,0.25)", marginTop:8}}>
                    {c.relapses} recaída{c.relapses>1?"s":""} registrada{c.relapses>1?"s":""}. Cada intento cuenta.
                  </div>
                )}
                {/* Daily tip */}
                <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid rgba(255,255,255,0.05)"}}>
                  <div style={{fontSize:10, color:"rgba(255,255,255,0.25)", marginBottom:4}}>Consejo de hoy</div>
                  <div style={{fontSize:12, color:`${c.color}bb`, fontWeight:600}}>{tips[c.key].icon} {tips[c.key].tip}</div>
                  <div style={{fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:2, lineHeight:1.4}}>{tips[c.key].why}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* ── TAB CIENCIA ── */}
        {activeTab === "ciencia" && (
          <div>
            <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:13}}>
              {COUNTERS.map(c => (
                <button key={c.key} onClick={()=>setActiveSciCounter(c.key)} style={{border:"none", borderRadius:10, padding:"8px 13px", cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif", fontSize:12, fontWeight:600, background:activeSciCounter===c.key?`${c.color}1a`:"rgba(255,255,255,0.04)", borderWidth:1, borderStyle:"solid", borderColor:activeSciCounter===c.key?`${c.color}44`:"rgba(255,255,255,0.07)", color:activeSciCounter===c.key?c.color:"#5a8a5a"}}>
                  {c.icon} {c.label}
                </button>
              ))}
            </div>
            <div style={{fontSize:12, color:"#4a7a4a", textAlign:"center", marginBottom:12}}>Toca cada hito para leer qué pasa en tu cuerpo</div>
            <MilestoneList milestones={sciCounter.milestones} days={sciDays} isExercise={activeSciCounter==="exercise"}/>
            <div style={{fontSize:11, color:"#2a4a2a", textAlign:"center", marginTop:10}}>Fuentes: OMS · American Heart Association · NHS · Diabetes UK</div>
          </div>
        )}

        {/* ── TAB CONSEJOS ── */}
        {activeTab === "consejos" && (
          <div>
            <div style={{background:"rgba(240,200,70,0.06)", border:"1px solid rgba(240,200,70,0.15)", borderRadius:13, padding:"14px 15px", marginBottom:14}}>
              <div style={{fontSize:10, color:"#907040", textTransform:"uppercase", letterSpacing:1.5, marginBottom:6}}>📅 Consejo de hoy · {today}</div>
              {Object.entries(tips).map(([key, t]) => {
                const c = COUNTERS.find(x=>x.key===key);
                return (
                  <div key={key} style={{marginBottom:10, paddingBottom:10, borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                    <div style={{fontSize:11, color:c.color, textTransform:"uppercase", letterSpacing:1, marginBottom:4}}>{c.icon} {c.label}</div>
                    <div style={{fontSize:13, fontWeight:600, color:"#c0d8c0"}}>{t.icon} {t.tip}</div>
                    <div style={{fontSize:12, color:"#5a7a5a", lineHeight:1.5, marginTop:3}}>{t.why}</div>
                  </div>
                );
              })}
            </div>

            <div className="card" style={{padding:15, marginBottom:10}}>
              <div className="hd" style={{fontSize:15, color:"#f0d050", marginBottom:7}}>El antojo dura solo 3 minutos</div>
              <div style={{fontSize:13, color:"#7a9a7a", lineHeight:1.6}}>Cualquier impulso — cigarro, azúcar, comida basura — alcanza su pico y baja solo en <strong style={{color:"#c8c860"}}>2-3 minutos</strong> si no actúas. Cada vez que lo superas, esa conexión neural se debilita permanentemente.</div>
            </div>

            <div style={{background:"rgba(96,196,224,0.07)", border:"1px solid rgba(96,196,224,0.15)", borderRadius:13, padding:15}}>
              <div style={{fontSize:13, fontWeight:700, color:"#60c4e0", marginBottom:7}}>🏋️ El ejercicio es el antídoto universal</div>
              <div style={{fontSize:13, color:"#5090a0", lineHeight:1.6}}>Libera <strong style={{color:"#90d4e8"}}>dopamina, serotonina y endorfinas</strong> — el mismo cóctel que el cigarro, el azúcar y la comida basura. 20 minutos al día sustituyen los tres vicios a la vez, sin daño colateral.</div>
            </div>
          </div>
        )}
      </div>

      {/* ── MODAL: SET DATE ── */}
      {modal?.type === "setDate" && (
        <div className="ov" onClick={()=>setModal(null)}>
          <div className="mb" onClick={e=>e.stopPropagation()}>
            <div className="hd" style={{fontSize:18, color:"#b0d8c0", marginBottom:5}}>
              {modal.key === "smoking" ? "🚭 ¿Cuándo dejaste de fumar?" : "🥗 ¿Cuándo empezaste la dieta?"}
            </div>
            <div style={{fontSize:13, color:"#5a8a5a", marginBottom:14, lineHeight:1.5}}>El contador se calculará automáticamente desde esta fecha cada vez que abras la app.</div>
            <input className="din" type="date" value={dateInput} onChange={e=>setDateInput(e.target.value)} style={{marginBottom:14}}/>
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>setModal(null)} style={{flex:1, background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.1)", color:"#8aaa8a", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif"}}>Cancelar</button>
              <button onClick={saveDate} style={{flex:2, background:"#5cba8a", border:"none", color:"#0a180a", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif", fontWeight:700, fontSize:14}}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL: ADD SESSION ── */}
      {modal?.type === "addSession" && (
        <div className="ov" onClick={()=>setModal(null)}>
          <div className="mb" onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center", fontSize:40, marginBottom:10}}>🏋️</div>
            <div className="hd" style={{fontSize:18, color:"#b0d8c0", textAlign:"center", marginBottom:8}}>¡Registrar sesión!</div>
            <div style={{fontSize:13, color:"#5a8a5a", textAlign:"center", marginBottom:6}}>Llevas <strong style={{color:"#60c4e0"}}>{exSessions} sesiones</strong> acumuladas.</div>
            <div style={{fontSize:12, color:"#4a7a4a", textAlign:"center", marginBottom:18, lineHeight:1.5}}>Cualquier movimiento cuenta: gym, caminar 30 min, bici, nadar, bailar...</div>
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>setModal(null)} style={{flex:1, background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.1)", color:"#8aaa8a", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif"}}>Cancelar</button>
              <button onClick={addSession} style={{flex:2, background:"#60c4e0", border:"none", color:"#0a1820", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif", fontWeight:700, fontSize:14}}>➕ Sumar sesión</button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL: RELAPSE COACHING ── */}
      {relapseCoach && (
        <div className="ov" onClick={()=>setRelapseCoach(null)}>
          <div className="mb" onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center", fontSize:36, marginBottom:10}}>🌱</div>
            <div className="hd" style={{fontSize:17, color:"#b0d8c0", textAlign:"center", marginBottom:12}}>Está bien. Sigues aquí.</div>
            <div style={{fontSize:14, color:"#90b090", lineHeight:1.7, marginBottom:20, fontStyle:"italic"}}>"{relapseCoach.msg}"</div>
            <div style={{fontSize:12, color:"#5a7a5a", marginBottom:18, lineHeight:1.5}}>Si confirmas la recaída, el contador se reinicia desde hoy. Tu historial de intentos queda guardado — cada uno te acerca más a lograrlo definitivamente.</div>
            <div style={{display:"flex", gap:8, flexDirection:"column"}}>
              <button onClick={()=>confirmRelapse(relapseCoach.key)} style={{background:"rgba(220,80,60,0.15)", border:"1px solid rgba(220,80,60,0.3)", color:"#e08070", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif", fontWeight:600}}>Sí, reiniciar contador desde hoy</button>
              <button onClick={()=>setRelapseCoach(null)} style={{background:"#5cba8a", border:"none", color:"#0a180a", borderRadius:10, padding:11, cursor:"pointer", fontFamily:"'Source Sans 3',sans-serif", fontWeight:700}}>Fue un momento débil. ¡Sigo!</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
