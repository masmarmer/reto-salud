<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Reto Salud"/>
<title>🌱 Tu Reto de Salud</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0c1c0c;font-family:'Source Sans 3',sans-serif;color:#deeede}
  .hd{font-family:'Playfair Display',serif}
  .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:16px}
  .tab{cursor:pointer;border:none;background:transparent;color:#5a8a5a;padding:9px 14px;border-radius:10px;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap}
  .tab.on{background:rgba(255,255,255,0.1);color:#deeede}
  .hbtn{cursor:pointer;border:none;border-radius:14px;padding:15px 17px;width:100%;text-align:left;display:flex;align-items:center;gap:12px;transition:all .2s}
  .mile{cursor:pointer;padding:13px 14px;border-radius:11px;margin-bottom:7px;display:flex;align-items:flex-start;gap:12px}
  .tip{padding:13px 15px;border-radius:11px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
  .din{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:9px;padding:8px 11px;color:#deeede;font-size:14px;font-family:'Source Sans 3',sans-serif;flex:1;min-width:0}
  .sbtn{background:#5cba8a;color:#0a180a;border:none;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
  .ebtn{background:transparent;border:1px solid rgba(255,255,255,0.12);color:#5a8a5a;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:11px;font-family:'Source Sans 3',sans-serif;margin-top:8px}
  .stab{cursor:pointer;border:none;border-radius:10px;padding:8px 13px;font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:600;transition:all .2s;margin-right:6px;margin-bottom:6px}
  .pb-o{background:rgba(255,255,255,0.08);border-radius:99px;height:5px;overflow:hidden;margin-top:5px}
  .pb-i{height:100%;border-radius:99px}
  .row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .mb{background:#162616;border:1px solid rgba(92,186,138,0.22);border-radius:20px;padding:26px;max-width:380px;width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const SMOKING_BENEFITS = [
  {day:1,  icon:"🩸",title:"Día 1",    short:"Monóxido de carbono fuera",      body:"El CO en sangre vuelve a nivel normal. Tu sangre transporta más oxígeno. Las células del corazón respiran mejor."},
  {day:2,  icon:"👃",title:"Día 2",    short:"Sabor y olfato despiertan",       body:"Las terminaciones nerviosas dañadas por el tabaco comienzan a regenerarse. La comida y los aromas vuelven a ser más vívidos."},
  {day:3,  icon:"🌬️",title:"Día 3",    short:"Bronquios más abiertos",          body:"Los bronquiolos se relajan. Respirar se siente más fácil. La nicotina ya está fuera del cuerpo — por eso el pico de ansiedad es ahora."},
  {day:7,  icon:"⭐",title:"Semana 1", short:"Pico de abstinencia superado",    body:"Entre días 3 y 7 es el momento más difícil. Si llegaste aquí, estadísticamente ya superaste el mayor riesgo de recaída."},
  {day:14, icon:"🦵",title:"Semana 2", short:"Circulación notablemente mejor",  body:"La circulación periférica mejora. Manos y pies más cálidos. El riesgo de infarto ya está bajando."},
  {day:30, icon:"🫁",title:"Mes 1",    short:"Cilios bronquiales renacen",      body:"Los cilios en tus pulmones se regeneran. Puede que tosas más — es buena señal: tu cuerpo está limpiando."},
  {day:90, icon:"💪",title:"3 Meses",  short:"+30% función pulmonar",           body:"La función pulmonar puede mejorar hasta un 30% en 3 meses. El ejercicio se vuelve más fácil."},
  {day:365,icon:"❤️",title:"1 Año",    short:"Riesgo cardíaco a la mitad",      body:"El riesgo de enfermedad coronaria se reduce a la MITAD. Tu corazón envejeció más despacio este año."},
];
const DIET_BENEFITS = [
  {day:1,  icon:"🧂",title:"Día 1",     short:"Menos retención de líquidos",    body:"Los ultraprocesados tienen 3-5x más sodio del recomendado. Al primer día la presión arterial baja y el cuerpo libera líquido retenido."},
  {day:3,  icon:"🩸",title:"Día 3",     short:"Glucosa más estable",            body:"Sin azúcar añadida, los picos de insulina disminuyen. La energía empieza a fluir de manera más constante."},
  {day:7,  icon:"🧠",title:"Semana 1",  short:"Niebla mental se aclara",        body:"El 'brain fog' causado por los picos de glucosa se reduce. El cerebro funciona con energía más estable."},
  {day:14, icon:"✨",title:"Semana 2",  short:"Piel más luminosa",              body:"Menos azúcar = menos glicación = colágeno más sano. Visible en 2 semanas."},
  {day:21, icon:"⚡",title:"3 Semanas", short:"Energía constante todo el día",  body:"Sin montañas rusas de glucosa, la energía se mantiene estable. El bajón de las 3 pm desaparece."},
  {day:30, icon:"🔥",title:"Mes 1",     short:"Metabolismo optimizado",         body:"La sensibilidad a la insulina mejora. Tu cuerpo quema grasa con más eficiencia. El peso empieza a regularse."},
  {day:90, icon:"💪",title:"3 Meses",   short:"Riesgo de diabetes tipo 2 baja", body:"Reducción del 30-50% en marcadores de resistencia a insulina en personas que eliminan el azúcar añadida."},
];
const EXERCISE_BENEFITS = [
  {day:1,  icon:"⚡",title:"Día 1",    short:"Dopamina y endorfinas liberadas", body:"Desde el primer entrenamiento, el cerebro libera dopamina, serotonina y endorfinas. El mismo cóctel que buscan el cigarro y el azúcar — pero sin daño."},
  {day:3,  icon:"😴",title:"3 días",   short:"Sueño más profundo",             body:"El ejercicio mejora la calidad del sueño desde los primeros días. Más sueño profundo = mejor recuperación y menos antojos."},
  {day:7,  icon:"🫀",title:"Semana 1", short:"Corazón más eficiente",          body:"Con solo una semana de ejercicio, el corazón bombea con más eficiencia y la presión arterial en reposo empieza a bajar."},
  {day:14, icon:"🔥",title:"Semana 2", short:"Metabolismo acelerado",          body:"El músculo quema más calorías que la grasa incluso en reposo. Tu tasa metabólica basal ya ha subido."},
  {day:21, icon:"💪",title:"3 Semanas",short:"Fuerza y resistencia notables",  body:"21 días es el umbral donde el cerebro empieza a registrar el ejercicio como hábito. Lo que antes costaba, ahora es más fácil."},
  {day:30, icon:"🧠",title:"Mes 1",    short:"Nuevas neuronas en el hipocampo",body:"El ejercicio aeróbico promueve la creación de nuevas neuronas. Memoria, concentración y estado de ánimo mejoran."},
  {day:90, icon:"🏃",title:"3 Meses",  short:"+20% capacidad cardiovascular",  body:"El VO2 max puede mejorar hasta un 20%. Tu cuerpo es literalmente más joven a nivel fisiológico."},
];

const COUNTERS = [
  {key:"smoking", label:"Sin fumar",      icon:"🚭",color:"#f0c84a",storageKey:"smokingStart", defaultDays:6, benefits:SMOKING_BENEFITS},
  {key:"diet",    label:"Dieta limpia",   icon:"🥗",color:"#e07060",storageKey:"dietStart",    defaultDays:0, benefits:DIET_BENEFITS},
  {key:"exercise",label:"Días ejercicio", icon:"🏋️",color:"#60c4e0",storageKey:"exStart",      defaultDays:0, benefits:EXERCISE_BENEFITS},
];
const HABITS = [
  {key:"smoking", label:"Sin fumar hoy",    icon:"🚭",color:"#f0c84a"},
  {key:"diet",    label:"Dieta limpia",     icon:"🥗",color:"#e07060"},
  {key:"exercise",label:"Ejercicio hecho",  icon:"🏋️",color:"#60c4e0"},
  {key:"pills",   label:"Pastillas tomadas",icon:"💊",color:"#9a7ad0"},
];
const TIPS = [
  {icon:"🥜",tip:"Come proteína en cada comida",       why:"Estabiliza glucosa y corta el antojo de dulce y snacks"},
  {icon:"💧",tip:"Agua antes de cada antojo",          why:"El 70% de los antojos desaparecen con buena hidratación"},
  {icon:"🚶",tip:"Camina 5 min cuando venga el antojo",why:"Libera dopamina — el mismo neuroquímico del cigarro o el azúcar"},
  {icon:"🍓",tip:"Fruta entera si necesitas dulce",    why:"La fibra ralentiza el azúcar y sacia. Una naranja sí, un zumo no."},
  {icon:"😴",tip:"Duerme 7-8 horas",                  why:"Dormir mal dispara grelina (hormona del hambre) e irresistibles los carbohidratos"},
  {icon:"🥣",tip:"No saltarte comidas",                why:"El hambre acumulada es el mayor enemigo de la dieta. Come cada 3-4h."},
];

const getTodayKey=()=>new Date().toISOString().split("T")[0];
const getDaysSince=d=>{if(!d)return 0;return Math.max(0,Math.floor((new Date()-new Date(d))/86400000));};
const getLS=(k,fb)=>{try{const v=localStorage.getItem(k);return v!==null?v:fb;}catch{return fb;}};
const setLS=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};

function App(){
  const [dates,setDates]=useState(()=>Object.fromEntries(COUNTERS.map(c=>[c.key,getLS(c.storageKey,"")])));
  const [editing,setEditing]=useState(()=>Object.fromEntries(COUNTERS.map(c=>[c.key,false])));
  const [tempDates,setTempDates]=useState({...dates});
  const [todayHabits,setTodayHabits]=useState(()=>{try{const s=getLS("habits_"+getTodayKey(),null);return s?JSON.parse(s):{};}catch{return{};}});
  const [streaks,setStreaks]=useState(()=>{try{const s=getLS("streaks",null);return s?JSON.parse(s):{};}catch{return{};}});
  const [activeTab,setActiveTab]=useState("hoy");
  const [sciKey,setSciKey]=useState("smoking");
  const [showCard,setShowCard]=useState(null);

  const days=Object.fromEntries(COUNTERS.map(c=>[c.key,dates[c.key]?getDaysSince(dates[c.key]):c.defaultDays]));

  function saveDate(key,storageKey){
    const d=tempDates[key];if(!d)return;
    setLS(storageKey,d);
    setDates(p=>({...p,[key]:d}));
    setEditing(p=>({...p,[key]:false}));
  }
  function toggleHabit(key){
    const u={...todayHabits,[key]:!todayHabits[key]};
    setTodayHabits(u);setLS("habits_"+getTodayKey(),JSON.stringify(u));
    const ns={...streaks,[key]:u[key]?(streaks[key]||0)+1:Math.max(0,(streaks[key]||0)-1)};
    setStreaks(ns);setLS("streaks",JSON.stringify(ns));
  }

  const allDone=HABITS.every(h=>todayHabits[h.key]);
  const sciBenefits=COUNTERS.find(c=>c.key===sciKey)?.benefits||[];
  const sciDays=days[sciKey]||0;
  const sd=days.smoking;
  const motiv=sd<7?"Días 3-7 son el pico más duro. Lo que sientes es química, no debilidad. Tu cerebro se está recableando.":sd<14?"¡Primera semana completa! El pico de abstinencia quedó atrás.":sd<30?"Dos semanas. Ya superaste estadísticamente el mayor riesgo de recaída.":"Un mes o más sin fumar. Eres ex-fumador. Eso no se quita.";

  return (
    <div style={{background:"linear-gradient(160deg,#0c1c0c,#162616,#0c160c)",minHeight:"100vh",paddingBottom:48}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(180deg,rgba(92,186,138,0.11) 0%,transparent 100%)",padding:"24px 16px 16px",borderBottom:"1px solid rgba(255,255,255,0.05)",textAlign:"center"}}>
        <div className="hd" style={{fontSize:24,color:"#b0d8c0",marginBottom:2}}>Tu Reto de Salud</div>
        <div style={{fontSize:10,color:"#4a7a4a",letterSpacing:3,textTransform:"uppercase"}}>Cuerpo · Mente · Constancia</div>

        {/* COUNTERS vertical */}
        <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:10}}>
          {COUNTERS.map(c=>{
            const d=days[c.key];
            const reached=c.benefits.filter(b=>b.day<=d);
            const cur=reached[reached.length-1];
            const nxt=c.benefits.find(b=>b.day>d);
            const pct=nxt?Math.min(100,(d/nxt.day)*100):100;
            return(
              <div key={c.key} style={{background:`${c.color}0f`,border:`1px solid ${c.color}2e`,borderRadius:14,padding:"14px 16px",textAlign:"left"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div>
                    <div style={{fontSize:10,color:c.color,textTransform:"uppercase",letterSpacing:1.5,marginBottom:4,opacity:.85}}>{c.icon} {c.label}</div>
                    <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                      <span className="hd" style={{fontSize:42,fontWeight:700,color:c.color,lineHeight:1}}>{d}</span>
                      <span style={{fontSize:13,color:`${c.color}77`}}>días</span>
                    </div>
                  </div>
                  <div style={{flex:1,textAlign:"right",paddingTop:4}}>
                    {cur&&<div style={{fontSize:12,color:`${c.color}cc`,lineHeight:1.3,marginBottom:5}}>{cur.short}</div>}
                    {nxt&&<div>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginBottom:2}}>→ día {nxt.day}</div>
                      <div className="pb-o"><div className="pb-i" style={{width:`${pct}%`,background:c.color}}/></div>
                    </div>}
                  </div>
                </div>
                {editing[c.key]?(
                  <div style={{display:"flex",gap:6,marginTop:9,alignItems:"center"}}>
                    <input className="din" type="date" value={tempDates[c.key]||""} onChange={e=>setTempDates(p=>({...p,[c.key]:e.target.value}))}/>
                    <button className="sbtn" onClick={()=>saveDate(c.key,c.storageKey)}>✓ Guardar</button>
                  </div>
                ):(
                  <button className="ebtn" onClick={()=>setEditing(p=>({...p,[c.key]:true}))}>✏️ Ajustar fecha inicio</button>
                )}
              </div>
            );
          })}
        </div>

        <div style={{marginTop:12,background:"rgba(240,200,70,0.07)",border:"1px solid rgba(240,200,70,0.18)",borderRadius:11,padding:"10px 14px",textAlign:"left"}}>
          <span style={{fontSize:12,color:"#d8d080",lineHeight:1.5}}>💬 {motiv}</span>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",gap:3,padding:"12px 12px 0",overflowX:"auto"}}>
        {[{id:"hoy",l:"📋 Hoy"},{id:"ciencia",l:"🔬 Ciencia"},{id:"consejos",l:"💡 Consejos"}].map(t=>(
          <button key={t.id} className={`tab ${activeTab===t.id?"on":""}`} onClick={()=>setActiveTab(t.id)}>{t.l}</button>
        ))}
      </div>

      <div style={{padding:13}}>

        {activeTab==="hoy"&&(
          <div>
            <div style={{fontSize:11,color:"#4a7a4a",textTransform:"uppercase",letterSpacing:2,marginBottom:12,textAlign:"center"}}>
              {new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
            </div>
            {allDone&&(
              <div style={{background:"linear-gradient(135deg,rgba(92,186,138,0.15),rgba(92,186,138,0.03))",border:"1px solid rgba(92,186,138,0.3)",borderRadius:14,padding:15,textAlign:"center",marginBottom:12}}>
                <div style={{fontSize:26,marginBottom:3}}>🎉</div>
                <div className="hd" style={{fontSize:17,color:"#5cba8a"}}>¡Día completado!</div>
                <div style={{fontSize:12,color:"#5a8a6a",marginTop:4,lineHeight:1.5}}>Cada día completo refuerza nuevos circuitos en tu cerebro. Es cambio físico real.</div>
              </div>
            )}
            {HABITS.map(h=>(
              <button key={h.key} className="hbtn" onClick={()=>toggleHabit(h.key)}
                style={{background:todayHabits[h.key]?`${h.color}18`:"rgba(255,255,255,0.04)",border:`1px solid ${todayHabits[h.key]?h.color+"44":"rgba(255,255,255,0.08)"}`,marginBottom:9}}>
                <div style={{width:42,height:42,borderRadius:"50%",background:todayHabits[h.key]?h.color:"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,color:todayHabits[h.key]?"#fff":undefined,transition:"all .3s"}}>
                  {todayHabits[h.key]?"✓":h.icon}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:600,color:todayHabits[h.key]?"#deeede":"#7a9a7a"}}>{h.label}</div>
                  <div style={{fontSize:11,color:"#2a5a2a",marginTop:2}}>Racha: {streaks[h.key]||0} días 🔥</div>
                </div>
                <div style={{fontSize:12,color:todayHabits[h.key]?"#5cba8a":"#254525",fontWeight:600}}>{todayHabits[h.key]?"¡Listo!":"Tap"}</div>
              </button>
            ))}
            <div className="card" style={{padding:15,marginTop:4}}>
              <div style={{fontSize:13,fontWeight:700,color:"#f0d050",marginBottom:6}}>💡 ¿Por qué atacas el dulce al dejar de fumar?</div>
              <div style={{fontSize:13,color:"#7a9a7a",lineHeight:1.6}}>La nicotina activa los mismos receptores de dopamina que el azúcar. Al quitarla, el cerebro busca ese estímulo en otra parte. <strong style={{color:"#c8b860"}}>Es neurobiología, no falta de voluntad.</strong> Este efecto se reduce en 2-4 semanas.</div>
            </div>
          </div>
        )}

        {activeTab==="ciencia"&&(
          <div>
            <div className="row" style={{marginBottom:12}}>
              {COUNTERS.map(c=>(
                <button key={c.key} className="stab" onClick={()=>setSciKey(c.key)}
                  style={{background:sciKey===c.key?`${c.color}1a`:"rgba(255,255,255,0.04)",border:`1px solid ${sciKey===c.key?c.color+"44":"rgba(255,255,255,0.07)"}`,color:sciKey===c.key?c.color:"#5a8a5a"}}>
                  {c.icon} {COUNTERS.find(x=>x.key===c.key)?.label}
                </button>
              ))}
            </div>
            <div style={{fontSize:12,color:"#4a7a4a",textAlign:"center",marginBottom:11}}>Toca cada hito para ver qué pasa en tu cuerpo</div>
            {sciBenefits.map(b=>{
              const reached=b.day<=sciDays;
              const isCur=sciBenefits.filter(x=>x.day<=sciDays).slice(-1)[0]?.day===b.day;
              return(
                <div key={b.day} className="mile" onClick={()=>setShowCard(b)}
                  style={{borderLeft:`3px solid ${reached?(isCur?"#f0d050":"#5cba8a"):"rgba(255,255,255,0.09)"}`,background:isCur?"rgba(240,208,50,0.06)":reached?"rgba(92,186,138,0.04)":"transparent",opacity:reached?1:.4}}>
                  <div style={{fontSize:22,flexShrink:0}}>{b.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:13,fontWeight:700,color:reached?"#b8d8c0":"#3a5a3a"}}>{b.title}</span>
                      {isCur&&<span style={{fontSize:9,background:"#f0d050",color:"#201400",borderRadius:5,padding:"2px 7px",fontWeight:700}}>AQUÍ</span>}
                      {reached&&!isCur&&<span style={{fontSize:9,background:"#5cba8a",color:"#081408",borderRadius:5,padding:"2px 7px",fontWeight:700}}>✓</span>}
                    </div>
                    <div style={{fontSize:12,color:reached?"#6a8a6a":"#2a4a2a",marginTop:2}}>{b.short}</div>
                  </div>
                  <div style={{fontSize:13,color:"#2a4a2a"}}>›</div>
                </div>
              );
            })}
            <div style={{fontSize:11,color:"#2a4a2a",textAlign:"center",marginTop:8}}>Fuentes: OMS · American Heart Association · NHS · Diabetes UK</div>
          </div>
        )}

        {activeTab==="consejos"&&(
          <div>
            <div className="card" style={{padding:15,marginBottom:12}}>
              <div className="hd" style={{fontSize:15,color:"#f0d050",marginBottom:6}}>El antojo dura solo 3 minutos</div>
              <div style={{fontSize:13,color:"#7a9a7a",lineHeight:1.6}}>Un impulso de craving alcanza su pico y baja solo en <strong style={{color:"#c8c860"}}>2-3 minutos</strong> si no actúas. Cada vez que lo superas, esa conexión neural se debilita.</div>
            </div>
            {TIPS.map((t,i)=>(
              <div key={i} className="tip">
                <div style={{fontSize:21,flexShrink:0}}>{t.icon}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:"#a0c8a0",marginBottom:3}}>{t.tip}</div>
                  <div style={{fontSize:12,color:"#4a7a4a",lineHeight:1.5}}>{t.why}</div>
                </div>
              </div>
            ))}
            <div style={{background:"rgba(96,196,224,0.07)",border:"1px solid rgba(96,196,224,0.18)",borderRadius:13,padding:15,marginTop:4}}>
              <div style={{fontSize:13,fontWeight:700,color:"#60c4e0",marginBottom:6}}>🏋️ El ejercicio reemplaza los tres vicios a la vez</div>
              <div style={{fontSize:13,color:"#5090a0",lineHeight:1.6}}>Libera <strong style={{color:"#90d4e8"}}>dopamina, serotonina y endorfinas</strong>: el mismo cóctel del cigarro, el azúcar y la comida basura — pero sin daño. 20-30 min al día es suficiente.</div>
            </div>
          </div>
        )}
      </div>

      {showCard&&(
        <div className="ov" onClick={()=>setShowCard(null)}>
          <div className="mb" onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center",fontSize:38,marginBottom:9}}>{showCard.icon}</div>
            <div className="hd" style={{fontSize:19,color:"#b0d8c0",textAlign:"center",marginBottom:4}}>{showCard.title}</div>
            <div style={{fontSize:13,color:"#5cba8a",textAlign:"center",marginBottom:13}}>{showCard.short}</div>
            <div style={{fontSize:13,color:"#7a9a7a",lineHeight:1.7,marginBottom:17}}>{showCard.body}</div>
            <button onClick={()=>setShowCard(null)} style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",color:"#deeede",borderRadius:9,padding:10,cursor:"pointer",fontFamily:"'Source Sans 3',sans-serif",fontSize:14}}>Cerrar</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
